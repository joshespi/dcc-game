<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dungeon Crawler Carl</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0812;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    canvas { display: block; image-rendering: pixelated; }
  </style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <script>
    var GAME_VERSION = '20260524-1';
    [
      'src/sprites.js',
      'src/systems/SaveSystem.js',
      'src/systems/CrawlerStatus.js',
      'src/systems/Messages.js',
      'src/dungeon/Generator.js',
      'src/entities/Enemy.js',
      'src/entities/Carl.js',
      'src/entities/Donut.js',
      'src/scenes/BootScene.js',
      'src/scenes/IntroScene.js',
      'src/scenes/GameScene.js',
      'src/scenes/UIScene.js',
      'src/scenes/DeathScene.js',
      'src/main.js',
    ].forEach(function (src) {
      document.write('<script src="' + src + '?v=' + GAME_VERSION + '"><\/script>');
    });
  </script>
</body>
</html>
